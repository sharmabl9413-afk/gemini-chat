name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare www folder
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; elif [ -f chat.html ]; then cp chat.html www/index.html; else echo "index.html ya chat.html repo mein nahi hai"; ls -la; exit 1; fi
      - name: Capacitor setup
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Gemini Chat" com.arvind.geminichat --web-dir www
          npx cap add android
          npx cap sync
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-chat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
