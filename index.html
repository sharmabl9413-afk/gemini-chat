<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini Chat</title>
<style>
:root{--bg:#212121;--side:#171717;--panel:#2f2f2f;--text:#ececec;--muted:#9b9b9b;--line:#3a3a3a;--hover:#2a2a2a;--btn:#ececec;--btntxt:#171717;--code:#0d0d0d;--accent:#10a37f}
@media (prefers-color-scheme:light){:root{--bg:#fff;--side:#f9f9f9;--panel:#f4f4f4;--text:#0d0d0d;--muted:#6b6b6b;--line:#e3e3e3;--hover:#ececec;--btn:#0d0d0d;--btntxt:#fff;--code:#f0f0f0}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#side{width:260px;background:var(--side);display:flex;flex-direction:column;padding:10px;flex-shrink:0;transition:margin .2s}
#newchat{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;text-align:left;width:100%}
#newchat:hover,.item:hover,.item.on{background:var(--hover)}
#list{flex:1;overflow:auto;margin:10px 0}
.item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;font-size:14px;cursor:pointer}
.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .del{opacity:0;color:var(--muted);padding:0 4px}
.item:hover .del{opacity:1}
#settingsbtn{padding:10px 12px;border-radius:10px;text-align:left;width:100%}
#settingsbtn:hover{background:var(--hover)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:52px}
#menu{display:none;padding:6px 10px;border-radius:8px}
#top b{font-weight:600}
#chat{flex:1;overflow:auto;padding:10px 0 20px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.msg{display:flex;margin:18px 0}
.msg.user{justify-content:flex-end}
.bubble{max-width:85%;line-height:1.65;font-size:16px;word-wrap:break-word}
.user .bubble{background:var(--panel);padding:10px 18px;border-radius:22px;white-space:pre-wrap}
.bot{display:flex;gap:14px;max-width:100%}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;flex-shrink:0;margin-top:2px}
.bot .bubble{max-width:100%;min-width:0}
.bubble p{margin:0 0 12px}.bubble p:last-child{margin:0}
.bubble ul,.bubble ol{margin:0 0 12px;padding-left:22px}
.bubble h1,.bubble h2,.bubble h3{margin:14px 0 8px;font-size:1.1em}
.bubble code{background:var(--code);padding:2px 6px;border-radius:6px;font-family:Consolas,Menlo,monospace;font-size:.9em}
.codebox{background:var(--code);border-radius:12px;margin:0 0 12px;overflow:hidden}
.codehead{display:flex;justify-content:space-between;padding:6px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.codebox pre{margin:0;padding:14px;overflow:auto}
.codebox code{background:none;padding:0}
.err{color:#ef4444}
.dots span{display:inline-block;width:8px;height:8px;margin-right:4px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none}}
#empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
#empty h1{font-size:28px;font-weight:600;margin:0}
.sugg{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px}
.sugg button{border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px;color:var(--muted)}
.sugg button:hover{background:var(--hover);color:var(--text)}
#bar{padding:0 18px 14px}
#box{max-width:760px;margin:0 auto;background:var(--panel);border-radius:26px;display:flex;align-items:flex-end;padding:8px 8px 8px 20px;gap:8px}
#input{flex:1;background:none;border:0;color:var(--text);font:inherit;font-size:16px;resize:none;max-height:200px;padding:8px 0;line-height:1.5}
#input:focus-visible{outline:none}
#send{width:36px;height:36px;border-radius:50%;background:var(--btn);color:var(--btntxt);display:grid;place-items:center;flex-shrink:0;font-size:18px}
#send:disabled{opacity:.35;cursor:not-allowed}
#note{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:10;padding:16px}
#modal.open{display:grid}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:440px}
.card h2{margin:0 0 14px;font-size:18px}
.card label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.card input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
.card .row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.card .row button{padding:9px 16px;border-radius:10px;border:1px solid var(--line)}
.card .row .pri{background:var(--btn);color:var(--btntxt);border-color:var(--btn)}
.card small{display:block;margin-top:10px;color:var(--muted);font-size:12px;line-height:1.5}
@media (max-width:760px){
#side{position:fixed;inset:0 auto 0 0;z-index:5;margin-left:-270px;width:260px}
#side.open{margin-left:0}
#menu{display:block}
}
</style>
</head>
<body>

<aside id="side">
  <button id="newchat">+ Naya chat</button>
  <div id="list"></div>
  <button id="settingsbtn">Settings (API key)</button>
</aside>

<div id="main">
  <div id="top"><button id="menu" aria-label="Menu">&#9776;</button><b id="modelname">Gemini</b></div>
  <div id="chat"><div class="wrap" id="msgs"></div></div>
  <div id="bar">
    <div id="box">
      <textarea id="input" rows="1" placeholder="Kuch bhi pucho..."></textarea>
      <button id="send" aria-label="Bhejo">&#8593;</button>
    </div>
    <div id="note">Gemini galti kar sakta hai. Zaroori jaankari ek baar check kar lena.</div>
  </div>
</div>

<div id="modal">
  <div class="card">
    <h2>Settings</h2>
    <label for="key">Gemini API key</label>
    <input id="key" type="password" placeholder="AIza..." autocomplete="off">
    <label for="model">Model ka naam</label>
    <input id="model" type="text" placeholder="gemini-3.8-flash">
    <small>Key aur chats sirf is browser mein save hote hain. Key aistudio.google.com se milegi. Model naam AI Studio mein dekh kar daalo.</small>
    <div class="row"><button id="cancel">Band karo</button><button id="save" class="pri">Save karo</button></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let chats = store.get('chats', []);
let current = store.get('current', null);
let apiKey = store.get('key', '');
let model = store.get('model', 'gemini-3.8-flash');
let busy = false;

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function inline(t){
  return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
}
function md(text){
  const parts = text.split(/```/);
  return parts.map((p, i) => {
    if (i % 2) {
      const nl = p.indexOf('\n');
      const lang = nl > -1 ? p.slice(0, nl).trim() : '';
      const code = nl > -1 ? p.slice(nl + 1) : p;
      return '<div class="codebox"><div class="codehead"><span>' + esc(lang || 'code') + '</span><button class="copy">Copy</button></div><pre><code>' + esc(code.replace(/\n$/,'')) + '</code></pre></div>';
    }
    const lines = p.split('\n'); let out = '', list = null, para = [];
    const flushP = () => { if (para.length) { out += '<p>' + para.join('<br>') + '</p>'; para = []; } };
    const flushL = () => { if (list) { out += '<' + list.t + '>' + list.items.map(x => '<li>' + x + '</li>').join('') + '</' + list.t + '>'; list = null; } };
    lines.forEach(l => {
      let m;
      if ((m = l.match(/^\s*[-*]\s+(.*)/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = {t:'ul', items:[]}; } list.items.push(inline(m[1])); }
      else if ((m = l.match(/^\s*\d+\.\s+(.*)/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = {t:'ol', items:[]}; } list.items.push(inline(m[1])); }
      else if ((m = l.match(/^#{1,3}\s+(.*)/))) { flushP(); flushL(); out += '<h3>' + inline(m[1]) + '</h3>'; }
      else if (!l.trim()) { flushP(); flushL(); }
      else { flushL(); para.push(inline(l)); }
    });
    flushP(); flushL();
    return out;
  }).join('');
}

function cur(){ return chats.find(c => c.id === current); }
function save(){ store.set('chats', chats); store.set('current', current); }

function renderList(){
  const l = $('list'); l.innerHTML = '';
  chats.slice().reverse().forEach(c => {
    const d = document.createElement('div');
    d.className = 'item' + (c.id === current ? ' on' : '');
    d.innerHTML = '<span>' + esc(c.title) + '</span><button class="del" aria-label="Delete">&#10005;</button>';
    d.onclick = () => { current = c.id; save(); renderAll(); $('side').classList.remove('open'); };
    d.querySelector('.del').onclick = e => {
      e.stopPropagation();
      chats = chats.filter(x => x.id !== c.id);
      if (current === c.id) current = chats.length ? chats[chats.length - 1].id : null;
      save(); renderAll();
    };
    l.appendChild(d);
  });
}

function msgHTML(m){
  if (m.role === 'user') return '<div class="msg user"><div class="bubble">' + esc(m.text) + '</div></div>';
  const body = m.err ? '<span class="err">' + esc(m.text) + '</span>' : md(m.text);
  return '<div class="msg"><div class="bot"><div class="avatar">G</div><div class="bubble">' + body + '</div></div></div>';
}

function renderMsgs(){
  const c = cur();
  if (!c || !c.messages.length) {
    $('msgs').innerHTML = '<div id="empty"><h1>Aaj kya kaam hai?</h1><div class="sugg">' +
      ['Python mein AI agent kaise banate hain?', 'Mujhe ek chhota business idea do', 'Is code ka error samjhao', 'Hindi mein ek email likho'].map(s => '<button>' + esc(s) + '</button>').join('') + '</div></div>';
    $('msgs').querySelectorAll('.sugg button').forEach(b => b.onclick = () => { $('input').value = b.textContent; send(); });
    return;
  }
  $('msgs').innerHTML = c.messages.map(msgHTML).join('');
  scrollDown();
}
function renderAll(){ renderList(); renderMsgs(); $('modelname').textContent = model; }
function scrollDown(){ const c = $('chat'); c.scrollTop = c.scrollHeight; }

function newChat(){
  current = null; save(); renderAll(); $('input').focus(); $('side').classList.remove('open');
}

async function send(){
  const text = $('input').value.trim();
  if (!text || busy) return;
  if (!apiKey) { openSettings(); return; }
  let c = cur();
  if (!c) {
    c = {id: String(Date.now()), title: text.slice(0, 40), messages: []};
    chats.push(c); current = c.id;
  }
  c.messages.push({role:'user', text});
  $('input').value = ''; autoGrow();
  save(); renderList(); renderMsgs();
  busy = true; $('send').disabled = true;
  $('msgs').insertAdjacentHTML('beforeend', '<div class="msg" id="typing"><div class="bot"><div class="avatar">G</div><div class="bubble dots"><span></span><span></span><span></span></div></div></div>');
  scrollDown();
  try {
    const contents = c.messages.filter(m => !m.err).map(m => ({role: m.role === 'user' ? 'user' : 'model', parts: [{text: m.text}]}));
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'x-goog-api-key': apiKey},
      body: JSON.stringify({contents})
    });
    const data = await r.json();
    if (!r.ok) throw new Error((data.error && data.error.message) || ('Error ' + r.status));
    const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
    const reply = parts.map(p => p.text || '').join('');
    c.messages.push(reply ? {role:'model', text: reply} : {role:'model', text:'Koi jawab nahi aaya. Dobara try karo.', err:true});
  } catch (e) {
    c.messages.push({role:'model', text: 'Error: ' + e.message + '. API key aur model ka naam Settings mein check karo.', err:true});
  }
  busy = false; $('send').disabled = false;
  save(); renderMsgs(); $('input').focus();
}

function autoGrow(){ const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 200) + 'px'; }
function openSettings(){ $('key').value = apiKey; $('model').value = model; $('modal').classList.add('open'); $('key').focus(); }
function closeSettings(){ $('modal').classList.remove('open'); }

$('send').onclick = send;
$('input').addEventListener('input', autoGrow);
$('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('newchat').onclick = newChat;
$('menu').onclick = () => $('side').classList.toggle('open');
$('settingsbtn').onclick = openSettings;
$('cancel').onclick = closeSettings;
$('modal').onclick = e => { if (e.target === $('modal')) closeSettings(); };
$('save').onclick = () => {
  apiKey = $('key').value.trim(); model = $('model').value.trim() || 'gemini-3.8-flash';
  store.set('key', apiKey); store.set('model', model);
  closeSettings(); renderAll();
};
$('msgs').addEventListener('click', e => {
  if (e.target.classList.contains('copy')) {
    const code = e.target.closest('.codebox').querySelector('code').textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => { e.target.textContent = 'Copied'; setTimeout(() => e.target.textContent = 'Copy', 1500); });
  }
});

renderAll();
if (!apiKey) openSettings();
</script>
</body>
</html>
